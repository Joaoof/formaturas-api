name: formaturasflow

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: formaturas-postgres
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE}:${API_TAG:-latest}
    container_name: formaturas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, internal]
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      Efi__Sandbox: ${EFI_SANDBOX:-true}
      Efi__ClientId: ${EFI_CLIENT_ID}
      Efi__ClientSecret: ${EFI_CLIENT_SECRET}
      Efi__CertificateBase64: ${EFI_CERTIFICATE_BASE64}
      Efi__CertificatePassword: ${EFI_CERTIFICATE_PASSWORD}
      Efi__PixKey: ${EFI_PIX_KEY}
      Efi__WebhookSecret: ${EFI_WEBHOOK_SECRET}
      Cors__Origins__0: ${CORS_ORIGIN_0:-http://localhost:5173}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: formaturas-watchtower
    restart: unless-stopped
    networks: [edge]
    environment:
      TZ: America/Sao_Paulo
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: "formaturasflow"
      REPO_USER: ${GHCR_USER}
      REPO_PASS: ${GHCR_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
